* url: https://thumbnail-1l9q.onrender.com
  description: Production server

paths:
/extract:
post:
operationId: extractWebsiteContent
summary: Extract website content
description: |
Extract metadata, thumbnail, OpenGraph information, page text,
images, links, video sources, and embed information from a URL.

```
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ExtractRequest'

        example:
          url: https://www.youtube.com/watch?v=dQw4w9WgXcQ
          planType: pro

  responses:
    '200':
      description: Successful extraction
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExtractResponse'

          example:
            status: ok
            plan_type: pro
            name: Video title
            description: Video description
            thumbnail_url: https://example.com/image.jpg
            embed_html: '<iframe src="https://example.com/embed"></iframe>'
            is_video: true
            deep_data:
              plan: pro
              pageContent: Example page content
              images:
                - https://example.com/image1.jpg
                - https://example.com/image2.jpg
              links:
                - text: Example link
                  href: https://example.com
              videoSources:
                - https://example.com/video.mp4
              has_video_sources: true

    '400':
      description: Invalid URL or invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

          example:
            status: error
            message: Invalid URL

    '403':
      description: Premium plan required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

          example:
            status: error
            message: Premium plan required

    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

          example:
            status: error
            message: Internal server error
```

components:

schemas:

```
ExtractRequest:
  type: object
  required:
    - url

  properties:

    url:
      type: string
      format: uri
      description: Website URL to analyze
      example: https://www.youtube.com/watch?v=dQw4w9WgXcQ

    planType:
      type: string
      description: Extraction plan level
      enum:
        - free
        - basic
        - pro
        - ultra
      default: free
      example: pro

ExtractResponse:
  type: object

  properties:

    status:
      type: string
      description: Extraction status
      example: ok

    plan_type:
      type: string
      description: Plan used for the extraction
      example: pro

    name:
      type: string
      description: Extracted title
      example: Video title

    description:
      type: string
      description: Extracted description
      example: Video description

    thumbnail_url:
      type: string
      format: uri
      nullable: true
      description: URL of the extracted thumbnail
      example: https://example.com/image.jpg

    embed_html:
      type: string
      nullable: true
      description: Generated embed HTML
      example: '<iframe src="https://example.com/embed"></iframe>'

    is_video:
      type: boolean
      description: Indicates whether the detected content is a video
      example: true

    deep_data:
      $ref: '#/components/schemas/DeepData'

DeepData:
  type: object

  properties:

    plan:
      type: string
      description: Deep extraction plan
      example: pro

    pageContent:
      type: string
      nullable: true
      description: Extracted page text content
      example: Example page content

    images:
      type: array
      description: Extracted image URLs
      items:
        type: string
        format: uri
      example:
        - https://example.com/image1.jpg
        - https://example.com/image2.jpg

    links:
      type: array
      description: Extracted page links
      items:
        $ref: '#/components/schemas/ExtractedLink'

    videoSources:
      type: array
      description: Detected video source URLs
      items:
        type: string
        format: uri
      example:
        - https://example.com/video.mp4

    has_video_sources:
      type: boolean
      description: Indicates whether video sources were detected
      example: true

ExtractedLink:
  type: object

  properties:

    text:
      type: string
      description: Visible link text
      example: Example link

    href:
      type: string
      format: uri
      description: Link URL
      example: https://example.com

ErrorResponse:
  type: object

  properties:

    status:
      type: string
      example: error

    message:
      type: string
      example: Invalid URL
```
